<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Lifecheck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg:#0d1117;
    --card:#12171f;
    --card-2:#0f141c;
    --stroke:#232c39;
    --stroke-soft:#1a212b;
    --track:#181f29;
    --yellow:#fdf846; --yellow-s:#e6d21f;
    --green:#36c05f;  --green-s:#268f45;
    --blue:#2daffb;   --blue-s:#1f8ad6;
    --red:#fd0235;    --red-s:#c00229;
    --pink:#ff77e4;   --pink-s:#e065c8;
    --ink:#0d1117;
    --text:#f4f6fa;
    --muted:#8b96a8;
    --muted-2:#aeb8c8;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:transparent;
    font-family:'Syne', sans-serif;
    color:var(--text);
    padding:2px;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
  }

  img{ -webkit-user-drag:none; user-drag:none; }
  canvas{ -webkit-user-drag:none; user-drag:none; display:block; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001s !important; transition-duration:0.001s !important; }
  }

  .stage{ width:396px; max-width:100%; }

  /* ================= COLLAPSED ================= */
  .collapsed{
    background:var(--card);
    border:3px solid var(--stroke);
    border-radius:16px;
    padding:12px 14px;
    display:flex;
    flex-direction:column;
    animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(.94) translateY(8px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .chk-row{ display:flex; align-items:center; gap:12px; }

  .chk-box{
    width:28px; height:28px;
    border-radius:8px;
    border:2.5px solid var(--muted);
    background:#0d1117;
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .chk-box:hover{ transform:scale(1.05); border-color:#aeb8c8; }
  .chk-box i{ font-size:14px; color:var(--ink); transform:scale(0); opacity:0; }
  .chk-box.spin i{ display:none; }
  .spinner-ring{
    display:none;
    width:16px; height:16px;
    border-radius:50%;
    border:2.5px solid rgba(255,249,62,0.22);
    border-top-color:var(--yellow);
  }
  .chk-box.spin .spinner-ring{ display:block; animation:spin .75s linear infinite; }
  .chk-box.checked{ background:#0d1117; border-color:var(--yellow-s); animation:checkPop .45s cubic-bezier(.34,1.9,.64,1) both; }
  .chk-box.checked i{ color:var(--yellow); transform:scale(1); opacity:1; transition:transform .3s cubic-bezier(.34,1.9,.64,1) .06s, opacity .2s ease .06s; }
  .collapsed.is-verified .chk-box,
  .collapsed.is-verified .chk-label{ cursor:default; pointer-events:none; }
  .collapsed.is-verified .chk-box:hover{ transform:none; border-color:var(--yellow-s); }
  /* a check that couldn't run: the box seizes up like a jammed mechanism */
  .chk-box.jammed{ border-color:var(--red-s); }
  .chk-box.jammed i{ color:var(--red); transform:scale(1); opacity:1; animation:jam .7s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes jam{
    0%{ transform:rotate(0deg) scale(1); }
    30%{ transform:rotate(52deg) scale(1.06); }
    42%{ transform:rotate(40deg) scale(1); }
    54%{ transform:rotate(48deg) scale(1); }
    66%{ transform:rotate(41deg) scale(1); }
    100%{ transform:rotate(45deg) scale(1); }
  }
  @keyframes checkPop{ 0%{transform:scale(1);} 45%{transform:scale(1.18);} 70%{transform:scale(.92);} 100%{transform:scale(1);} }

  .chk-label{ flex:1 1 auto; font-weight:700; font-size:15px; color:var(--text); cursor:pointer; user-select:none; }
  .chk-label .dots::after{ content:''; animation:dotting 1.2s steps(4,end) infinite; }
  @keyframes dotting{ 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} 100%{content:'';} }

  /* ---- Lifecheck wordmark badge ---- */
  /* white overlay: flatten the multicolour wordmark to a solid white mark
     (brightness(0)->black, invert(1)->white) while keeping its transparency */
  .wm{ filter:brightness(0) invert(1); }
  .lc-badge{ flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:3px; line-height:1; }
  .lc-badge .wm{ height:13px; width:auto; display:block; }
  .lc-badge .ver{ font-weight:700; font-size:8.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
  .lc-badge .ver b{ color:var(--yellow); font-weight:800; }
  .lc-badge .legal{ font-weight:600; font-size:8px; letter-spacing:.2px; }
  .lc-badge .legal a{ color:var(--muted); text-decoration:none; }
  .lc-badge .legal a:hover{ color:var(--muted-2); text-decoration:underline; }

  /* ---- consent strip (kept small + quiet, like a captcha footer) ---- */
  .consent{
    margin-top:7px; padding-top:6px;
    border-top:1.5px solid var(--stroke-soft);
    display:flex; gap:5px; align-items:center;
    font-weight:500; font-size:7.4px; line-height:1.3; letter-spacing:.1px;
    color:#6f7a8b;
  }
  .consent .cshield{ color:var(--green); font-size:8px; flex:0 0 auto; opacity:.9; }
  .consent a{ color:#8b96a8; text-decoration:underline; text-decoration-color:rgba(255,255,255,.18); text-underline-offset:1px; }
  .consent a:hover{ color:var(--text); }

  /* ================= EXPANDED ================= */
  .expanded{
    position:relative;
    background:var(--card);
    border:3px solid var(--stroke);
    border-radius:20px;
    overflow:hidden;
    animation:expandIn .45s cubic-bezier(.34,1.5,.64,1) both;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1.5px);
    background-size:16px 16px;
  }
  @keyframes expandIn{
    0%{ opacity:0; transform:scale(.9) translateY(6px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .hidden{ display:none !important; }

  .exp-header{
    display:flex; align-items:center; justify-content:flex-start;
    padding:15px 16px 12px;
  }
  .exp-header .brand-mark{ display:flex; align-items:center; gap:9px; }
  .exp-header .wm{ height:14px; width:auto; }
  .exp-header .tag{ font-weight:700; font-size:9px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .exp-header .tag b{ color:var(--yellow); font-weight:800; }

  .test-chip{
    display:inline-flex; align-items:center; gap:6px;
    font-weight:800; font-size:10px; letter-spacing:.5px; text-transform:uppercase;
    padding:4px 9px; border-radius:100px;
    border:1.5px solid var(--chip-s, var(--stroke));
    color:var(--chip, var(--muted));
    background:color-mix(in srgb, var(--chip, transparent) 12%, transparent);
    width:fit-content;
  }
  .test-chip i{ font-size:9px; }

  .exp-body{
    border-top:2px solid var(--stroke);
    padding:16px 16px 6px;
    display:flex; flex-direction:column; gap:12px;
  }

  .prompt{ font-weight:700; font-size:15px; line-height:1.35; }
  .prompt b.hl{ color:var(--yellow); font-weight:800; }
  .prompt .sub{ display:block; font-weight:500; font-size:12px; color:var(--muted); margin-top:4px; }

  /* ---- grid / image tiles ---- */
  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .tile{
    position:relative;
    aspect-ratio:1/1; background:var(--track); border:2.5px solid var(--stroke); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--text); cursor:pointer;
    overflow:hidden;
    transition:transform .15s cubic-bezier(.34,1.6,.64,1), border-color .15s ease, background .15s ease;
  }
  .tile:hover{ transform:translateY(-2px); border-color:#3a475a; }
  .tile canvas{ width:66%; height:66%; object-fit:contain; pointer-events:none; }
  .tile.selected{ border-color:var(--blue-s); background:rgba(44,174,252,0.16); color:var(--blue); animation:tileBounce .35s cubic-bezier(.34,1.9,.64,1); }
  @keyframes tileBounce{ 0%{transform:scale(1);} 50%{transform:scale(1.14);} 100%{transform:scale(1);} }
  .tile.wrong{ border-color:var(--red-s) !important; background:rgba(255,1,50,0.16) !important; color:var(--red) !important; animation:shakeSmall .4s ease; }
  /* v1.3: the challenges are keyboard-operable now, so they need a focus ring */
  .tile:focus-visible, .numbtn:focus-visible, .beacon:focus-visible,
  .probe:focus-visible, .handle:focus-visible, .dial-handle:focus-visible{
    outline:3px solid var(--blue); outline-offset:2px;
  }
  .tile.correct-flash{ border-color:var(--green-s) !important; background:rgba(62,207,110,0.18) !important; color:var(--green) !important; }

  /* ---- number pad (tally) ---- */
  .numpad{ display:grid; grid-template-columns:repeat(6,1fr); gap:7px; margin-top:2px; }
  .numbtn{
    aspect-ratio:1/1; background:var(--track); border:2.5px solid var(--stroke); border-radius:11px;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; color:var(--text); cursor:pointer;
    transition:transform .14s cubic-bezier(.34,1.6,.64,1), border-color .14s ease, background .14s ease;
  }
  .numbtn:hover{ transform:translateY(-2px); border-color:#3a475a; }
  .numbtn.wrong{ border-color:var(--red-s); background:rgba(255,1,50,0.18); color:var(--red); animation:shakeSmall .4s ease; }
  .numbtn.right{ border-color:var(--green-s); background:rgba(62,207,110,0.18); color:var(--green); }

  /* ---- slider ---- */
  .slide-wrap{ padding:6px 2px 2px; }
  .track{ position:relative; height:44px; background:var(--track); border:2.5px solid var(--stroke); border-radius:22px; margin-top:24px; }
  .target-zone{ position:absolute; top:-4px; bottom:-4px; background:rgba(62,207,110,0.18); border-left:2.5px dashed var(--green-s); border-right:2.5px dashed var(--green-s); border-radius:8px; }
  .target-zone i{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--green); font-size:13px; }
  .handle{ position:absolute; top:50%; left:0; width:40px; height:40px; margin-top:-20px; border-radius:50%; background:var(--green); border:3px solid var(--green-s); display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
  .handle:active{ cursor:grabbing; }
  .handle i{ color:#06210f; font-size:16px; }
  .handle.bob{ animation:handleBob 1.8s ease-in-out infinite; }
  @keyframes handleBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-2px);} }

  /* ---- rotate dial ---- */
  .dial-wrap{ display:flex; justify-content:center; padding:6px 0 2px; }
  .dial{ position:relative; width:150px; height:150px; touch-action:none; }
  .dial svg{ width:100%; height:100%; display:block; }
  .dial-handle{
    position:absolute; width:30px; height:30px; margin:-15px;
    border-radius:50%; background:var(--pink); border:3px solid var(--pink-s);
    display:flex; align-items:center; justify-content:center; cursor:grab;
    transition:box-shadow .15s ease;
  }
  .dial-handle i{ color:#3a0f30; font-size:13px; }
  .dial-center{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--muted); font-size:11px; font-weight:700; text-align:center; pointer-events:none; }

  /* ---- sequence ---- */
  .seq-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .beacon{
    aspect-ratio:1/1; background:var(--track); border:2.5px solid var(--stroke); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; color:var(--text); cursor:pointer;
    transition:transform .15s cubic-bezier(.34,1.6,.64,1), border-color .15s ease, background .15s ease;
  }
  .beacon:hover{ transform:translateY(-2px); }
  .beacon.done{ border-color:var(--yellow-s); background:rgba(255,249,62,0.18); color:var(--yellow); animation:tileBounce .35s cubic-bezier(.34,1.9,.64,1); }
  .beacon.bad{ border-color:var(--red-s); background:rgba(255,1,50,0.18); color:var(--red); animation:shakeSmall .4s ease; }
  @keyframes shakeSmall{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

  /* ---- code entry ---- */
  .code-box{
    position:relative;
    background:var(--track); border:2.5px solid var(--stroke); border-radius:14px;
    height:70px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .code-box svg.noise{ position:absolute; inset:0; width:100%; height:100%; opacity:.5; }
  .code-char{ display:inline-block; font-weight:800; font-size:28px; letter-spacing:1px; position:relative; z-index:1; }
  .code-input{
    width:100%; background:var(--track); border:2.5px solid var(--stroke); border-radius:12px;
    color:var(--text); font-family:'Syne',sans-serif; font-weight:700; font-size:16px; letter-spacing:3px;
    text-align:center; text-transform:uppercase; padding:10px; outline:none;
  }
  .code-input:focus{ border-color:var(--red-s); }
  .code-input.wrong{ border-color:var(--red-s); animation:shakeSmall .4s ease; }

  .exp-footer{
    padding:12px 16px 18px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:2px solid var(--stroke);
  }
  .foot-note{ font-weight:500; font-size:8.5px; line-height:1.3; color:var(--muted); max-width:170px; }
  .foot-note i{ color:var(--green); margin-right:3px; }

  .verify-btn{
    appearance:none; border:none; cursor:pointer;
    background:var(--green); border:2.5px solid var(--green-s); color:#06210f;
    font-family:'Syne', sans-serif; font-weight:800; font-size:13px;
    padding:10px 18px; border-radius:12px; flex:0 0 auto;
    transition:transform .15s cubic-bezier(.34,1.9,.64,1), filter .15s ease;
  }
  .verify-btn:hover{ filter:brightness(1.06); transform:translateY(-1px); }
  .verify-btn:active{ transform:translateY(1px) scale(.97); }
  .verify-btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }

  .status{
    margin:0 16px 16px; border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px; font-weight:700; font-size:13px;
    animation:bounceIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes bounceIn{ 0%{ opacity:0; transform:scale(.7) translateY(6px);} 55%{ opacity:1; transform:scale(1.05) translateY(-2px);} 100%{ opacity:1; transform:scale(1) translateY(0);} }
  .status.pass{ background:rgba(62,207,110,0.14); border:2px solid var(--green-s); color:var(--green); }
  .status.fail{ background:rgba(255,1,50,0.14); border:2px solid var(--red-s); color:var(--red); animation:shake .5s ease both; }
  .status i{ font-size:16px; flex:0 0 auto; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-7px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(3px);} }
  .status span.d{ font-weight:400; font-size:10.5px; opacity:.85; display:block; margin-top:2px; }

  /* ---- 09 · trace the beam (v1.3) ---- */
  .trace-wrap{ position:relative; touch-action:none; cursor:crosshair; padding:2px 0; }
  .trace-svg{ width:100%; height:120px; display:block; overflow:visible; }
  .beam-track{ fill:none; stroke:var(--stroke); stroke-width:16; stroke-linecap:round; }
  .beam-live{ fill:none; stroke:var(--blue); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .08s linear; }
  .beam-start{ fill:var(--yellow); stroke:var(--yellow-s); stroke-width:3; animation:beamPulse 1.5s ease-in-out infinite; }
  .beam-end{ fill:var(--green); stroke:var(--green-s); stroke-width:3; }
  @keyframes beamPulse{ 0%,100%{ opacity:1; r:9; } 50%{ opacity:.6; r:11; } }
  .trace-wrap.live .beam-start{ animation:none; opacity:.55; }
  .trace-wrap.stray .beam-live{ stroke:var(--red); }
  .trace-wrap.ok .beam-live{ stroke:var(--green); }
  .trace-hint{ text-align:center; color:var(--muted); font-size:11px; font-weight:700; margin-top:2px; }
  .trace-wrap.ok .trace-hint{ color:var(--green); }

  /* ---- 10 · tag the probe (v1.3) ---- */
  .catch-box{
    position:relative; height:150px; border-radius:14px;
    border:2.5px solid var(--stroke); background:var(--track);
    overflow:hidden; cursor:crosshair;
  }
  .catch-box.missed{ border-color:var(--red-s); }
  .probe{
    position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px;
    border-radius:50%; background:var(--green); border:3px solid var(--green-s);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .probe i{ color:#06210f; font-size:16px; pointer-events:none; }
  .probe.tagged{ animation:tileBounce .3s cubic-bezier(.34,1.9,.64,1); background:var(--yellow); border-color:var(--yellow-s); }
  .probe.locked{ background:var(--yellow); border-color:var(--yellow-s); }
  .catch-tally{
    position:absolute; right:8px; bottom:6px; pointer-events:none;
    color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.04em;
  }

  /* ---- 11 · find the twins (v1.3) ---- */
  .pair-grid{ grid-template-columns:repeat(3,1fr); }

  /* the keyboard escape hatch on the two pointer-only games */
  .swap-row{ display:flex; justify-content:center; margin-top:8px; }
  .swap-btn{
    appearance:none; background:none; border:none; cursor:pointer;
    color:var(--muted); font-family:'Syne',sans-serif; font-weight:700; font-size:11.5px;
    text-decoration:underline; text-underline-offset:3px; padding:4px 6px; border-radius:6px;
  }
  .swap-btn:hover{ color:var(--text); }
  .swap-btn:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; }

  .retry-btn{
    margin-top:8px; appearance:none; border:none; cursor:pointer;
    background:var(--yellow); border:2.5px solid var(--yellow-s); color:#2a2600;
    font-family:'Syne', sans-serif; font-weight:800; font-size:12.5px;
    padding:9px 14px; border-radius:11px;
  }
</style>
</head>
<body>

<div class="stage">

  <!-- COLLAPSED -->
  <div class="collapsed" id="collapsed">
    <div class="chk-row">
      <div class="chk-box" id="chkBox"><i class="fa-solid fa-check"></i><span class="spinner-ring"></span></div>
      <div class="chk-label" id="chkLabel">I'm not a robot</div>
      <div class="lc-badge">
        <img class="wm" src="LifeCheck%20logo.png" alt="Lifecheck" draggable="false" />
        <div class="ver">v<b>1.3</b></div>
        <div class="legal"><a href="https://swiftaw.com/legal/privacy-policy" target="_blank" rel="noopener">Privacy</a> &middot; <a href="https://swiftaw.com/legal/terms-of-service" target="_blank" rel="noopener">Terms</a></div>
      </div>
    </div>
    <div class="consent">
      <i class="fa-solid fa-shield-halved cshield"></i>
      <div>Checking the box lets Swiftaw record how you move and play, and use it to improve its systems &amp; AI.</div>
    </div>
  </div>

  <!-- EXPANDED -->
  <div class="expanded hidden" id="expanded">
    <div class="exp-header">
      <div class="brand-mark">
        <img class="wm" src="LifeCheck%20logo.png" alt="Lifecheck" draggable="false" />
        <span class="tag">v<b>1.3</b></span>
      </div>
    </div>

    <div class="exp-body">
      <div class="test-chip" id="testChip"></div>
      <div class="prompt" id="promptText"></div>
      <div id="challengeArea"></div>
    </div>

    <div class="status hidden" id="statusBox"></div>

    <div class="exp-footer" id="expFooter">
      <div class="foot-note"><i class="fa-solid fa-shield-halved"></i>How you solve this is recorded to train &amp; improve Swiftaw's systems.</div>
      <button class="verify-btn hidden" id="verifyBtn">Verify</button>
    </div>
  </div>

</div>

<script>
(function(){
  const VERSION = '1.3';

  /* ---------------- host bridge ---------------- */
  // Lifecheck is served from swiftaw.com and embedded via <iframe>. The
  // challenge logic never touches the host page — the only thing that
  // crosses the boundary is a one-way "verified" message + token.
  function post(event, extra){
    try{
      parent.postMessage(Object.assign({ source:'swiftaw-lifecheck', v:VERSION, event:event }, extra||{}), '*');
    }catch(e){}
  }
  function reportSize(){
    const h = document.querySelector('.stage').offsetHeight + 8;
    post('resize', { height:h });
  }
  const ro = ('ResizeObserver' in window) ? new ResizeObserver(reportSize) : null;

  /* ---------------- Supabase / token issuance ---------------- */
  const SUPA_URL = 'https://mwszvynzzugbowdngzab.supabase.co';
  const SUPA_KEY = 'sb_publishable_dqsqX2klo1j4xSyEFA7O1w_UjM8lEGf';
  const SUPA_CDN = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  const P = new URLSearchParams(location.search);
  const SITE_KEY = P.get('k') || '';
  const HOST = P.get('host') || '';

  // Reserved PREVIEW keys — first-party demos, not real integrations.
  //
  // swiftaw.com's own showcase widgets ("Try it, it's real", the account
  // page, the Supernova gate) are not rows in `lifecheck_keys` and never
  // will be: they exist to demonstrate the widget, not to gate anything.
  // v1.2 sent EVERY supplied key to the server, so those demos asked
  // Supabase about a key that does not exist, got NULL back, and rendered
  // "site key rejected" on the one page whose entire job is to show the
  // thing working.
  //
  // The rule: a key ending in `_public` is a preview key. It never touches
  // the server and mints a clearly-labelled, deliberately unverifiable
  // preview token. Real `lc_site_…` keys still go to the server, and the
  // server is still the only thing that can accept or reject them.
  const PREVIEW_KEY = /_public$/i.test(SITE_KEY);
  const SERVER_MODE = !!SITE_KEY && !PREVIEW_KEY;

  // v1.3 · INVISIBLE MODE. No checkbox: the host page calls
  // Lifecheck.execute() and the frame decides silently, only unfolding into a
  // visible challenge when the signals don't add up. See the `host-signals`
  // handler below for how a zero-size frame gets a cursor trail to read, and
  // why that trail is trusted less than one of our own.
  const INVISIBLE = P.get('mode') === 'invisible';

  // v1.3 · TWO LANES, ONE COIN FLIP.
  //
  // Half of all sessions are read from behaviour and only interrupted when
  // the signals don't add up (SIGNAL_LANE). The other half play a mini-game
  // no matter how clean they look (GAME_LANE).
  //
  // Two reasons it's split rather than picking one:
  //   · Every game played is a labelled demonstration. Passing everyone who
  //     looks fine means only the suspicious half ever generates gameplay
  //     data, which is exactly the biased sample you don't want to learn
  //     from. The forced lane keeps a steady supply of games played by
  //     people who are unambiguously human.
  //   · A bot that gets waved through learns that looking smooth is enough.
  //     When half the doors open onto a game regardless, smooth isn't a
  //     strategy any more.
  //
  // Decided once per widget load, so a visitor never sees the treatment
  // change under them mid-check. Invisible mode opts out: a host chose it to
  // avoid interrupting people, and a coin-flip challenge would defeat the
  // entire point of it — there, behaviour decides, as documented.
  const GAME_LANE = !INVISIBLE && Math.random() < 0.5;
  const DEBUG = P.has('lcdebug');   // ?lcdebug=1 → log telemetry successes too
  let sbClient = null;

  // A per-load session id ties every event from this widget instance together.
  const SESSION_ID = 'lcs_' + Math.random().toString(36).slice(2,12) + Date.now().toString(36);

  function firstPartyEmbed(){
    function ours(h){ return /(^|\.)swiftaw\.com$/i.test(h); }
    try{
      const ao = window.location.ancestorOrigins;
      if(ao && ao.length) return ours(new URL(ao[0]).hostname);
    }catch(e){}
    try{
      if(document.referrer) return ours(new URL(document.referrer).hostname);
    }catch(e){}
    // opened directly (no embedding parent) → treat as a local preview
    return window.top === window.self;
  }
  const FIRST_PARTY = firstPartyEmbed();

  function loadScript(src){
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  async function getSb(){
    if(sbClient) return sbClient;
    if(!window.supabase || !window.supabase.createClient) await loadScript(SUPA_CDN);
    sbClient = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: false } });
    return sbClient;
  }
  // A preview token. Minted entirely in the browser, so it proves nothing and
  // deliberately says so in its own prefix: `lifecheck-verify` will always
  // answer `invalid-input-token` for one. Used by the reserved `_public`
  // demo keys and by first-party previews on swiftaw.com.
  function localToken(){
    const rnd = () => Math.random().toString(36).slice(2, 12);
    return 'LC' + VERSION + '-preview_' + rnd() + rnd() + '.' + Date.now().toString(36);
  }
  // Why a token issue failed, for the host page + our own telemetry. The RPC
  // returns NULL for both "no such key" and "host not allowed", so we can only
  // name the class of failure, not which one — but "rejected" vs "the network
  // died" is the distinction an integrator actually needs.
  let LAST_TOKEN_ERR = '';
  async function issueToken(passed){
    LAST_TOKEN_ERR = '';
    if(SERVER_MODE){
      try {
        const sb = await getSb();
        // v1.3 sends the human-confidence score along with the token, so
        // `lifecheck_verify_token` can hand a real number back to the
        // integrator instead of the constant 0.9 it used to invent.
        //
        // The widget is a static file on a CDN and the migration is a manual
        // step, so the two WILL be out of order for someone: if the extra
        // arguments aren't there yet, PostgREST answers "no such function"
        // rather than ignoring them. Fall back to the v1.2 call shape once
        // and carry on unscored — a deploy-order mistake should cost the
        // score field, not every verification on the site.
        const base = { p_site_key: SITE_KEY, p_host: HOST, p_passed: passed || 'challenge' };
        let { data, error } = await sb.rpc('lifecheck_issue_token', Object.assign({
          p_score: LAST_SIGNALS ? LAST_SIGNALS.score : null,
          p_mode: INVISIBLE ? 'invisible' : 'checkbox'
        }, base));
        if(error && (error.code === 'PGRST202' || /function .*does not exist|schema cache/i.test(error.message || ''))){
          logEvent('rpc_fallback', { detail:{ reason:'issue_token-signature', code:error.code || '' } });
          ({ data, error } = await sb.rpc('lifecheck_issue_token', base));
        }
        if(error){ LAST_TOKEN_ERR = 'issue-request-failed'; return null; }
        if(!data){ LAST_TOKEN_ERR = 'sitekey-rejected'; return null; }
        return data;
      } catch(e){ LAST_TOKEN_ERR = 'issue-request-failed'; return null; }
    }
    // A reserved `_public` key is a preview anywhere it is embedded — it can't
    // be mistaken for a real pass, so it needn't be pinned to swiftaw.com, and
    // pinning it is what left local mirrors and staging copies showing an
    // error instead of a demo.
    if(PREVIEW_KEY || FIRST_PARTY) return localToken();
    LAST_TOKEN_ERR = 'no-sitekey';
    return null;
  }

  /* ---------------- interaction telemetry (v1.2) ----------------
     We record how the visitor uses the check + mini-games and stream it to
     Supabase in small, throttled batches. Fire-and-forget: it never blocks
     or breaks verification, and silently no-ops if the network is down.
     Consent for this is shown in the collapsed card. */
  let _evQueue = [];
  let _flushT = null;
  // running per-session tallies → rolled into one feature row at the end
  let _shown = 0, _wrong = 0, _susp = 0, _spot = false, _summarySent = false;
  function logEvent(type, opts){
    try{
      opts = opts || {};
      if(type !== 'session_summary'){
        if(opts.suspicious) _susp++;
        if(type === 'minigame_wrong' || type === 'challenge_fail') _wrong++;
        if(type === 'challenge_open') _shown++;
        if(type === 'spot_check') _spot = true;
      }
      const ev = {
        t: type,
        challenge: opts.challenge || '',
        outcome: opts.outcome || '',
        suspicious: !!opts.suspicious,
        detail: opts.detail || {}
      };
      // ?lcdebug=1 keeps every event on the page as well as sending it, so an
      // integrator can read exactly what Lifecheck saw without a database.
      if(DEBUG){
        (window.__lcEvents = window.__lcEvents || []).push(ev);
        console.log('[Lifecheck]', ev.t, ev);
      }
      _evQueue.push(ev);
      if(_evQueue.length > 60) _evQueue.shift();
      scheduleFlush();
    }catch(e){}
  }

  // One tidy, labelled feature vector per session — this is the row you'd
  // actually train a human/bot model on (or cluster for anomaly detection).
  function sessionSummary(passed, via){
    if(_summarySent) return;
    _summarySent = true;
    let stats = {}, reason = '', score = null;
    try{ const a = analyzeCursor(); stats = a.stats; reason = a.reason; score = a.score; }catch(e){}
    logEvent('session_summary', {
      outcome: passed ? 'pass' : 'fail',
      suspicious: _susp > 0,
      detail: {
        schema: 'lc-session-2',
        v: VERSION,
        durationMs: Date.now() - loadedAt,
        via: via || '',
        passed: !!passed,
        touch: touchUsed,
        pen: penUsed,
        mode: INVISIBLE ? 'invisible' : 'checkbox',
        // which lane this session was assigned, so the two halves can be
        // compared later — that comparison is the whole point of splitting
        lane: INVISIBLE ? 'invisible' : (GAME_LANE ? 'game' : 'signal'),
        challengesShown: _shown,
        wrongTaps: _wrong,
        suspiciousSignals: _susp,
        spotChecked: _spot,
        cursorReason: reason,
        humanScore: score,
        cursor: stats
      }
    });
    flushEvents();
  }
  function scheduleFlush(){ if(_flushT) return; _flushT = setTimeout(flushEvents, 1400); }
  async function flushEvents(){
    _flushT = null;
    if(!_evQueue.length) return;
    const batch = _evQueue.splice(0, _evQueue.length);
    try{
      const sb = await getSb();
      // NOTE: a failed RPC RESOLVES with { error } — it does not throw — so we
      // must inspect error, or failures are invisible. Surface it either way.
      const { error } = await sb.rpc('lifecheck_log_events', {
        p_events: batch,
        p_site_key: SITE_KEY || null,
        p_host: HOST || null,
        p_session: SESSION_ID
      });
      if(error){
        console.warn('[Lifecheck] telemetry rejected:', error.message || error.hint || error.code || error);
      } else if(DEBUG){
        console.log('[Lifecheck] logged ' + batch.length + ' event(s)');
      }
    }catch(e){
      // network / CDN / client failure — telemetry must never affect the check
      console.warn('[Lifecheck] telemetry failed to send:', (e && e.message) || e);
    }
  }
  /* Getting the data out before the tab does.
     `beforeunload` alone was not enough: flushing is an async request, and a
     browser tearing the page down cancels it — so a visitor who solved a game
     and closed the tab within the 1.4s flush window took the whole
     demonstration with them. That is precisely the row we most want.

     `visibilitychange → hidden` fires while the page is still alive (tab
     switch, app switch, and on mobile it is often the LAST callback you get),
     so a plain flush there has time to finish. It deliberately does not send
     the session summary: someone glancing at another tab hasn't abandoned
     anything, and sending it early would burn the one-shot guard and lose the
     real outcome. `pagehide` is the genuine end of the page, so that is where
     the summary goes. */
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden'){ try{ flushEvents(); }catch(e){} }
  });
  window.addEventListener('pagehide', () => { try{ sessionSummary(false, 'abandoned'); flushEvents(); }catch(e){} });

  document.addEventListener('contextmenu', e => { e.preventDefault(); logEvent('tamper', { outcome:'suspicious', suspicious:true, detail:{ kind:'contextmenu' } }); });
  document.addEventListener('dragstart', e => e.preventDefault());

  const collapsed = document.getElementById('collapsed');
  const chkBox = document.getElementById('chkBox');
  const chkLabel = document.getElementById('chkLabel');

  const expanded = document.getElementById('expanded');
  const testChip = document.getElementById('testChip');
  const promptText = document.getElementById('promptText');
  const challengeArea = document.getElementById('challengeArea');
  const verifyBtn = document.getElementById('verifyBtn');
  const statusBox = document.getElementById('statusBox');
  const expFooter = document.getElementById('expFooter');

  const LOADING_PHRASES = [
    'Detecting life forms',
    'Scanning biosignals',
    'Calibrating sensors',
    'Reading heat signature',
    'Checking pulse'
  ];

  /* life forms vs machines — used by the drawn image challenges */
  const LIFE = [
    {e:'🐶',n:'dog'},{e:'🐱',n:'cat'},{e:'🐸',n:'frog'},{e:'🐟',n:'fish'},
    {e:'🐢',n:'turtle'},{e:'🦋',n:'butterfly'},{e:'🐝',n:'bee'},{e:'🌸',n:'flower'},
    {e:'🍄',n:'mushroom'},{e:'🐌',n:'snail'},{e:'🦎',n:'lizard'},{e:'🌿',n:'leaf'}
  ];
  const MACHINE = [
    {e:'🤖',n:'robot'},{e:'⚙️',n:'gear'},{e:'🛰️',n:'satellite'},{e:'🚀',n:'rocket'},
    {e:'🔌',n:'plug'},{e:'🖥️',n:'computer'},{e:'📡',n:'dish'},{e:'🔋',n:'battery'}
  ];

  const TEST_META = {
    imagepick:{ label:'Life scan · 01', icon:'fa-hand-pointer',   color:'var(--green)', colorS:'var(--green-s)' },
    oddone:   { label:'Life scan · 02', icon:'fa-clone',          color:'var(--pink)',  colorS:'var(--pink-s)'  },
    tally:    { label:'Life scan · 03', icon:'fa-hashtag',        color:'var(--yellow)',colorS:'var(--yellow-s)'},
    grid:     { label:'Signal test · 04',icon:'fa-satellite-dish',color:'var(--blue)',  colorS:'var(--blue-s)'  },
    slider:   { label:'Signal test · 05',icon:'fa-rocket',        color:'var(--green)', colorS:'var(--green-s)' },
    rotate:   { label:'Signal test · 06',icon:'fa-compass',       color:'var(--pink)',  colorS:'var(--pink-s)'  },
    sequence: { label:'Signal test · 07',icon:'fa-list-ol',       color:'var(--yellow)',colorS:'var(--yellow-s)'},
    code:     { label:'Signal test · 08',icon:'fa-keyboard',      color:'var(--red)',   colorS:'var(--red-s)'   },
    // v1.3 · three new games, each chosen for a kind of interaction the
    // other eight never asked for: following a path, tracking something
    // that moves, and remembering what you already turned over.
    trace:    { label:'Signal test · 09',icon:'fa-route',         color:'var(--blue)',  colorS:'var(--blue-s)'  },
    catchit:  { label:'Signal test · 10',icon:'fa-crosshairs',    color:'var(--green)', colorS:'var(--green-s)' },
    pairs:    { label:'Life scan · 11',  icon:'fa-layer-group',   color:'var(--pink)',  colorS:'var(--pink-s)'  }
  };
  const TEST_TYPES = Object.keys(TEST_META);
  // The pointer-path games are pointless on a touch screen with no hover and
  // hard on a small one, so phones draw from the tap-only pool.
  const COARSE = (function(){
    try{ return window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }
    catch(e){ return false; }
  })();
  const TOUCH_TYPES = ['imagepick','oddone','tally','grid','sequence','code','pairs','catchit'];
  let lastType = null;
  let challengeStart = 0;   // for timing / suspicious-speed detection

  /* ---------------- real cursor tracking ---------------- */
  let samples = [];
  let touchUsed = false;
  let loadedAt = Date.now();
  let penUsed = false;
  let maxPressure = 0;
  let scrollTicks = 0, keyTicks = 0;
  let LAST_SIGNALS = null;
  let TRACE = null;             // assigned below; see "demonstration traces"

  document.addEventListener('pointermove', (e) => {
    if(e.pointerType === 'touch') touchUsed = true;
    if(e.pointerType === 'pen') penUsed = true;
    if(typeof e.pressure === 'number' && e.pressure > maxPressure) maxPressure = e.pressure;
    samples.push({ x:e.clientX, y:e.clientY, t:Date.now() });
    if(samples.length > 400) samples.shift();
    if(TRACE) TRACE.sample(e.clientX, e.clientY);
  }, { passive:true });
  document.addEventListener('touchstart', () => { touchUsed = true; }, { passive:true });
  window.addEventListener('wheel', () => { scrollTicks++; }, { passive:true });
  document.addEventListener('keydown', () => { keyTicks++; }, { passive:true });

  // Two things only the browser itself can tell us about an input event, and
  // both are cheap: whether the user agent generated it, and how far apart
  // the click press and release were. A dispatched MouseEvent has
  // isTrusted === false unless it came from real hardware, and a synthetic
  // click has no press-to-release gap at all because it never had one.
  let untrusted = 0, trusted = 0;
  let clickDowns = [], clickHolds = [];
  document.addEventListener('pointerdown', (e) => {
    if(e.isTrusted) trusted++; else untrusted++;
    clickDowns.push(Date.now());
    if(clickDowns.length > 20) clickDowns.shift();
  }, { passive:true, capture:true });
  document.addEventListener('pointerup', (e) => {
    if(e.isTrusted) trusted++; else untrusted++;
    const down = clickDowns[clickDowns.length - 1];
    if(down != null){
      clickHolds.push(Date.now() - down);
      if(clickHolds.length > 20) clickHolds.shift();
    }
  }, { passive:true, capture:true });

  /* ================== v1.3 · the signal stack ==================
     Scored, not vetoing: every reading contributes to a 0..1 confidence
     figure rather than deciding on its own, and the caller acts on the
     total. All the individual readings are kept in `stats`, so what lands
     in lifecheck_events is a labelled feature vector, not just a verdict.

     Per-signal rationale and tuning notes live in HANDOFF.md, deliberately
     not here — this file is served to every visitor. */

  function mean(a){ return a.length ? a.reduce((s,v)=>s+v,0)/a.length : 0; }
  function stdev(a){
    if(a.length < 2) return 0;
    const m = mean(a);
    return Math.sqrt(mean(a.map(v => (v-m)*(v-m))));
  }

  // Static environment tells, independent of how the pointer moved.
  function envFlags(){
    const f = [];
    try{ if(navigator.webdriver) f.push('webdriver'); }catch(e){}
    try{ if(/HeadlessChrome|PhantomJS|SlimerJS|Puppeteer|Playwright/i.test(navigator.userAgent)) f.push('headless-ua'); }catch(e){}
    try{ if(!navigator.languages || !navigator.languages.length) f.push('no-languages'); }catch(e){}
    try{ if(navigator.hardwareConcurrency === 0) f.push('no-cores'); }catch(e){}
    try{
      if(window.__nightmare || window._phantom || window.callPhantom ||
         window.__selenium_unwrapped || window.domAutomation || window.__driver_evaluate) f.push('automation-hook');
    }catch(e){}
    return f;
  }

  // returns { human, score, reason, stats }
  function analyzeCursor(){
    const elapsed = Date.now() - loadedAt;
    const env = envFlags();

    // Each entry is [name, penalty]. Penalties add up and come off a
    // starting confidence of 1; anything at or above PASS_AT reads as human.
    const PASS_AT = 0.5;
    const hits = [];
    let score = 1;
    const hit = (name, penalty) => { hits.push(name); score -= penalty; };

    if(env.length) hit('automation-env', 0.6);

    /* ---- 10 · untrusted events. The browser marks any event a script
           dispatched rather than the user producing it. Cheap and decisive. */
    if(untrusted > 0) hit('synthetic-events', 0.65);

    /* ---- 11 · click hold. A press and its release are tens of
           milliseconds apart on real hardware, and zero when dispatched. */
    if(clickHolds.length){
      const holdMax = Math.max.apply(null, clickHolds);
      if(holdMax <= 1) hit('instant-click', 0.35);
    }

    /* ---- touch / pen: no cursor trail to read, so lean on timing ---- */
    if(touchUsed && samples.length < 5){
      if(elapsed <= 220) hit('touch-too-fast', 0.6);
      const human = score >= PASS_AT;
      return {
        human, score:+score.toFixed(3),
        reason: human ? 'touch' : (hits[0] || 'touch-flag'),
        stats:{ touch:true, pen:penUsed, elapsed, env, flags:hits, score:+score.toFixed(3) }
      };
    }

    const n = samples.length;

    /* ---- 01 · did it move at all? ---- */
    if(n < 5) hit('no-movement', 0.55);

    /* ---- 02 · faster than a person can react? ---- */
    if(elapsed < 300) hit('too-fast', 0.5);

    let dist = 0, netDisp = 0, straight = 0;
    let jitterRatio = 0, speedCv = 0, dtCv = 0, dwells = 0, fracCoords = 0;

    if(n >= 5){
      const dts = [], speeds = [];
      for(let i=1;i<n;i++){
        const dx = samples[i].x - samples[i-1].x;
        const dy = samples[i].y - samples[i-1].y;
        const dstep = Math.hypot(dx, dy);
        const dt = Math.max(1, samples[i].t - samples[i-1].t);
        dist += dstep;
        dts.push(dt);
        speeds.push(dstep / dt);
        if(dt > 90) dwells++;
      }
      netDisp = Math.hypot(samples[n-1].x - samples[0].x, samples[n-1].y - samples[0].y);
      straight = dist > 0 ? netDisp / dist : 0;

      /* ---- 03 · barely moved ---- */
      if(dist < 40) hit('barely-moved', 0.45);

      /* ---- 04 · direction changes ---- */
      let dirChanges = 0;
      for(let i=2;i<n;i++){
        const a = Math.atan2(samples[i-1].y-samples[i-2].y, samples[i-1].x-samples[i-2].x);
        const b = Math.atan2(samples[i].y-samples[i-1].y, samples[i].x-samples[i-1].x);
        let diff = Math.abs(a-b);
        if(diff > Math.PI) diff = 2*Math.PI - diff;
        if(diff > 0.15) dirChanges++;
      }
      jitterRatio = dirChanges / n;
      if(jitterRatio < 0.04)      hit('robotic-path', 0.4);
      else if(jitterRatio < 0.09) hit('low-wobble', 0.12);

      /* ---- 05 · straightness ---- */
      if(n >= 12){
        if(straight > 0.985)     hit('ruler-straight', 0.3);
        else if(straight > 0.94) hit('very-direct', 0.1);
      }

      /* ---- 06 · speed profile ---- */
      speedCv = mean(speeds) > 0 ? stdev(speeds) / mean(speeds) : 0;
      if(n >= 12){
        if(speedCv < 0.15)     hit('constant-speed', 0.3);
        else if(speedCv < 0.32) hit('flat-speed', 0.1);
      }

      /* ---- 07 · event-clock regularity ---- */
      dtCv = mean(dts) > 0 ? stdev(dts) / mean(dts) : 0;
      if(n >= 12 && dtCv < 0.08) hit('metronome-timing', 0.25);

      /* ---- 08 · dwell ---- */
      if(n >= 25 && dwells === 0) hit('never-paused', 0.15);

      /* ---- 09 · coordinate resolution ---- */
      let frac = 0;
      for(let i=0;i<n;i++) if(samples[i].x % 1 !== 0 || samples[i].y % 1 !== 0) frac++;
      fracCoords = frac / n;
      if(n >= 30 && fracCoords === 0) hit('integer-coords', 0.08);
    }

    const human = score >= PASS_AT;
    return {
      human,
      score: +score.toFixed(3),
      reason: human ? 'clean' : (hits[0] || 'low-score'),
      stats: {
        n, elapsed,
        dist: Math.round(dist),
        net: Math.round(netDisp),
        straight: +straight.toFixed(3),
        jitter: +jitterRatio.toFixed(3),
        speedCv: +speedCv.toFixed(3),
        dtCv: +dtCv.toFixed(3),
        dwells,
        fracCoords: +fracCoords.toFixed(2),
        maxPressure: +maxPressure.toFixed(2),
        scrollTicks, keyTicks,
        trusted, untrusted,
        holdMs: clickHolds.length ? Math.max.apply(null, clickHolds) : null,
        touch: touchUsed, pen: penUsed,
        env,
        flags: hits,
        score: +score.toFixed(3)
      }
    };
  }

  /* ================== v1.3 · demonstration traces ==================
     The mini-games stopped being only a gate this release. Every challenge
     a person solves is also a small, complete demonstration: here is the
     board, here is what a human looked at, here is where they moved, here
     is what they clicked, and here is whether it worked.

     Recorded that way the games become a supervised dataset Supernova can
     learn to PLAY from — observation → action → outcome, the same shape
     you'd use to train any behaviour-cloning policy:

       state    a declarative description of the board. Every clickable
                thing carries a semantic label and a NORMALISED box
                ([x, y, w, h] as 0..1 fractions of the challenge area), so a
                policy learns "the frog tile", never "the pixel at 412,300".
       actions  what the visitor did, in order, with timing: which element,
                where inside it they landed, and whether it was right.
       path     the cursor trail through the challenge, normalised the same
                way — how a human approaches, overshoots and settles on a
                target, not just what they finally picked.
       solved   the label. Reward, if you'd rather think of it that way.

     Everything is resolution- and layout-independent, capped in size, and
     carries no page content — it describes our own widget's board and
     nothing about the site around it. This is the interaction data the
     consent line in the collapsed card is talking about. */
  TRACE = (function(){
    const MAX_PATH    = 160;   // cursor points kept per challenge
    const MIN_GAP_MS  = 35;    // don't record faster than this
    const MAX_ACTIONS = 60;
    let cur = null;

    function rect(){
      const el = document.getElementById('challengeArea');
      return el ? el.getBoundingClientRect() : null;
    }
    // client coords → 0..1 within the challenge area
    function norm(clientX, clientY, r){
      r = r || rect();
      if(!r || !r.width || !r.height) return null;
      return [ +((clientX - r.left) / r.width).toFixed(4),
               +((clientY - r.top)  / r.height).toFixed(4) ];
    }
    // an element's box, normalised the same way
    function boxOf(el){
      const r = rect();
      if(!r || !r.width || !r.height || !el) return null;
      const b = el.getBoundingClientRect();
      return [ +((b.left - r.left)/r.width).toFixed(4),
               +((b.top  - r.top )/r.height).toFixed(4),
               +(b.width /r.width ).toFixed(4),
               +(b.height/r.height).toFixed(4) ];
    }

    return {
      begin(game){
        cur = { game:game, state:{}, path:{ x:[], y:[], t:[] },
                actions:[], t0:Date.now(), lastT:-1e9 };
      },
      recording(){ return !!cur; },
      // Called by each builder once the board has rendered, with everything a
      // policy would need to choose a move.
      state(obj){ if(cur) cur.state = obj || {}; },
      // Measure the boxes of the elements a builder just appended. Deferred a
      // frame so layout has actually happened.
      measure(fn){
        requestAnimationFrame(() => { try{ fn(boxOf); }catch(e){} });
      },
      sample(clientX, clientY){
        if(!cur || cur.path.x.length >= MAX_PATH) return;
        const t = Date.now() - cur.t0;
        if(t - cur.lastT < MIN_GAP_MS) return;
        const p = norm(clientX, clientY);
        if(!p) return;
        cur.lastT = t;
        cur.path.x.push(p[0]); cur.path.y.push(p[1]); cur.path.t.push(t);
      },
      // kind: tap | drag | key | submit
      act(kind, extra){
        if(!cur || cur.actions.length >= MAX_ACTIONS) return;
        cur.actions.push(Object.assign({ k:kind, t:Date.now() - cur.t0 }, extra || {}));
      },
      // Where inside an element a tap landed (0..1 of that element) — the
      // difference between "clicked the tile" and "clicked its dead centre",
      // which is one of the clearer human tells in the data.
      tapOn(el, ev, extra){
        let at = null, on = null;
        try{
          if(ev && ev.clientX != null){
            at = norm(ev.clientX, ev.clientY);
            const b = el.getBoundingClientRect();
            if(b.width && b.height) on = [ +((ev.clientX-b.left)/b.width).toFixed(3),
                                           +((ev.clientY-b.top )/b.height).toFixed(3) ];
          }
        }catch(e){}
        this.act('tap', Object.assign({ at:at, on:on }, extra || {}));
      },
      end(solved, solveMs){
        if(!cur) return;
        const tr = cur; cur = null;
        logEvent('demo_trace', {
          challenge: tr.game,
          outcome: solved ? 'pass' : 'fail',
          detail: {
            schema: 'lc-demo-1',
            game: tr.game,
            state: tr.state,
            actions: tr.actions,
            path: tr.path,
            solved: !!solved,
            solveMs: solveMs == null ? null : solveMs
          }
        });
      },
      abort(){ cur = null; }
    };
  })();

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function pick(arr,n){ return shuffle(arr).slice(0,n); }

  // Mini-game icons are drawn with Twemoji onto a canvas so the artwork looks
  // identical on every OS/browser. If the Twemoji CDN is unreachable we fall
  // back to the platform's own emoji glyph.
  const TWEMOJI_BASE = 'https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/72x72/';
  function twemojiCode(str){
    const pts = [];
    for(const ch of str){
      const c = ch.codePointAt(0);
      if(c !== 0xFE0F) pts.push(c.toString(16)); // Twemoji strips the VS16 selector
    }
    return pts.join('-');
  }
  function emojiCanvas(emoji, px){
    px = px || 96;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const c = document.createElement('canvas');
    c.width = px*dpr; c.height = px*dpr;
    const ctx = c.getContext('2d');

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      const pad = Math.round(px*0.10*dpr);
      ctx.drawImage(img, pad, pad, c.width - 2*pad, c.height - 2*pad);
    };
    img.onerror = () => {
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.save();
      ctx.scale(dpr, dpr);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = Math.round(px*0.66) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(emoji, px/2, px/2 + px*0.03);
      ctx.restore();
    };
    img.src = TWEMOJI_BASE + twemojiCode(emoji) + '.png';
    return c;
  }
  /* v1.3 · every tile gets its own small rotation, scale and sometimes a
     mirror. A person reads a frog as a frog through all of it; a script
     matching artwork against a reference has to actually recognise the thing
     instead of comparing bytes, because no two boards ever render the same
     pixels — including, deliberately, the two "identical" tiles in Find the
     twins, which are the same creature at different angles rather than the
     same image twice. Kept gentle enough that nothing becomes a guess. */
  function tileWith(emoji){
    const el = document.createElement('div');
    el.className = 'tile';
    const art = emojiCanvas(emoji);
    const rot = (Math.random()*28 - 14).toFixed(1);
    const scale = 0.90 + Math.random()*0.15;
    const flip = Math.random() < 0.5 ? -1 : 1;
    art.style.transform =
      `rotate(${rot}deg) scale(${(scale*flip).toFixed(3)}, ${scale.toFixed(3)})`;
    el.appendChild(art);
    return el;
  }

  function resetCollapsed(){
    loadedAt = Date.now();
    samples = [];
    chkBox.className = 'chk-box';
    chkBox.querySelector('i').className = 'fa-solid fa-check';
    chkLabel.textContent = "I'm not a robot";
    expanded.classList.add('hidden');
    collapsed.classList.remove('hidden');
    collapsed.style.animation = 'none';
    void collapsed.offsetWidth;
    collapsed.style.animation = '';
    reportSize();
  }

  let locked = false;
  chkBox.addEventListener('click', startVerify);
  chkLabel.addEventListener('click', startVerify);

  /* ================== v1.3 · invisible mode ==================
     `Lifecheck.render(el, { size:'invisible' })` mounts a zero-size frame and
     nothing else. The host calls `Lifecheck.execute()` at the moment it
     actually needs a human — on submit, usually — and the frame answers with
     a token, or unfolds into a real challenge if it isn't convinced.

     The catch, stated plainly because it changes the threat model: a frame
     with no size never sees the pointer, so the loader forwards the host
     page's cursor trail in. Script running on the host page could fabricate
     that trail, which our own in-frame samples can't be. So host-supplied
     signals are held to a much higher bar (PASS_INVISIBLE below) than a
     checkbox session, the environment probe still runs inside the frame
     where the host can't reach it, and anything short of convincing gets a
     visible challenge rather than a quiet pass. Invisible mode buys less
     friction, not more certainty — pick it for that reason. */
  const PASS_INVISIBLE = 0.78;
  let hostSignals = false;
  let executed = false;

  window.addEventListener('message', function(e){
    const d = e.data;
    if(!d || d.source !== 'swiftaw-lifecheck-host') return;
    if(e.source !== parent) return;
    if(d.event === 'signals' && Array.isArray(d.samples)){
      // [[x, y, tOffsetMs], …] from the embedding page
      for(let i=0;i<d.samples.length && i<400;i++){
        const s = d.samples[i];
        if(!s || s.length < 3) continue;
        samples.push({ x:+s[0], y:+s[1], t:loadedAt + (+s[2]) });
      }
      if(samples.length) hostSignals = true;
      if(samples.length > 400) samples = samples.slice(-400);
    } else if(d.event === 'execute'){
      executeInvisible();
    }
  });

  function executeInvisible(){
    if(!INVISIBLE || executed) return;
    executed = true;
    const a = analyzeCursor();
    LAST_SIGNALS = a;
    a.stats.hostSignals = hostSignals;
    const bar = hostSignals ? PASS_INVISIBLE : 0.5;
    const ok = a.score >= bar;
    logEvent('invisible_execute', {
      outcome: ok ? 'pass' : 'info',
      suspicious: !ok,
      detail: Object.assign({ bar:bar, hostSignals:hostSignals }, a.stats)
    });
    if(ok){
      issueToken('signals-invisible').then(function(token){
        if(!token){
          const t = tokenFailText();
          logEvent('key_fail', { outcome:'suspicious', suspicious:!FIRST_PARTY, detail:{ serverMode:SERVER_MODE, firstParty:FIRST_PARTY, reason:LAST_TOKEN_ERR, at:'invisible' } });
          post('error', { code: LAST_TOKEN_ERR || 'no-sitekey', message: t.detail });
          return;
        }
        logEvent('verified', { outcome:'pass', detail:{ via:'invisible' } });
        sessionSummary(true, 'invisible');
        post('verified', { token: token });
        armExpiry();
      });
      return;
    }
    // Not convinced — unfold and make them play for it.
    post('expand', {});
    openChallenge();
  }

  function startVerify(){
    if(locked) return;
    locked = true;
    chkLabel.removeAttribute('title');
    chkBox.className = 'chk-box spin';           // clears a previous jam
    logEvent('check_click', { detail:{ touch:touchUsed } });
    const phrase = LOADING_PHRASES[Math.floor(Math.random()*LOADING_PHRASES.length)];
    chkLabel.innerHTML = `${phrase}<span class="dots"></span>`;

    setTimeout(()=>{
      const a = analyzeCursor();
      LAST_SIGNALS = a;
      if(!a.human){
        logEvent('cursor_flag', { outcome:'suspicious', suspicious:true, detail:{ reason:a.reason, score:a.score, stats:a.stats } });
      }

      // GAME_LANE (see the coin flip up top): this session always plays,
      // however clean it looks. The signals are still read and still
      // recorded — we just don't let them buy a way out of the game.
      if(GAME_LANE){
        logEvent('lane_challenge', {
          outcome: a.human ? 'info' : 'suspicious',
          suspicious: !a.human,
          detail: Object.assign({ lane:'game' }, a.stats)
        });
        openChallenge();
        return;
      }

      // SIGNAL_LANE: read the behaviour, and only interrupt if it doesn't
      // add up. Even a clean read gets spot-checked sometimes, at a rate
      // that scales with confidence rather than a flat coin flip, so the
      // friction lands on the sessions that earned it.
      const spotChance = Math.min(0.5, Math.max(0.08, 0.08 + (1 - a.score) * 0.75));
      const spotCheck = a.human && Math.random() < spotChance;
      if(a.human && spotCheck) logEvent('spot_check', { detail:Object.assign({ lane:'signal', spotChance:+spotChance.toFixed(2) }, a.stats) });
      if(a.human && !spotCheck){
        logEvent('passive_pass', { outcome:'pass', detail:Object.assign({ lane:'signal' }, a.stats) });
        passCollapsed();
      } else {
        openChallenge();
      }
    }, 700);
  }

  /* ---------------- token expiry ----------------
     A server token dies about two minutes after it is minted, and until now
     nothing told the host page that. `data-expired-callback` has been in the
     docs since v1.1 and could never fire, so a form left open for five
     minutes submitted a token the verify endpoint was always going to
     reject with `timeout-or-duplicate` — and the visitor got the blame for
     it. The widget now counts down with the token and hands the check back
     just before it goes stale.

     Preview tokens are never verified by anyone, so they don't expire. */
  const TOKEN_TTL_MS = 110000;   // just inside the server's ~2 min
  let _expiryT = null;
  function armExpiry(){
    if(_expiryT) clearTimeout(_expiryT);
    if(!SERVER_MODE) return;
    _expiryT = setTimeout(function(){
      _expiryT = null;
      if(INVISIBLE){ executed = false; post('expired', {}); logEvent('token_expired', {}); return; }
      logEvent('token_expired', {});
      post('expired', {});
      // Put the box back so the visitor can simply click again.
      locked = false;
      collapsed.classList.remove('is-verified');
      resetCollapsed();
      chkLabel.textContent = 'Check again, that one timed out';
    }, TOKEN_TTL_MS);
  }

  function passCollapsed(){
    issueToken('signals').then(function(token){
      if(!token){ keyFail(); return; }
      chkBox.classList.remove('spin');
      chkBox.classList.add('checked');
      chkLabel.textContent = 'Verified';
      collapsed.classList.add('is-verified');
      logEvent('verified', { outcome:'pass', detail:{ via:'signals' } });
      sessionSummary(true, 'signals');
      post('verified', { token: token });
      armExpiry();
    });
  }

  // v1.3 — a check that can't run is a jammed machine, not the visitor's
  // fault, so it now says so in the widget's own voice. The playful line is
  // cosmetic: the precise cause still rides along in `detail`, and the
  // machine-readable `code` on the `error` postMessage is unchanged, so
  // nothing an integrator branches on moves.
  const FAIL_LINES = [
    'Clunk! Gears stuck.',
    'Sput! Belt slipped.',
    'Bzzt! Fuse blown.',
    'Beep, boop. Nothing doing.',
    'Boop! Wires crossed.',
    'Beep... beep... no signal.'
  ];
  let _lastFailLine = -1;
  function failLine(){
    let i = Math.floor(Math.random()*FAIL_LINES.length);
    if(i === _lastFailLine) i = (i + 1) % FAIL_LINES.length;   // never twice running
    _lastFailLine = i;
    return FAIL_LINES[i];
  }
  function tokenFailText(){
    const line = failLine();
    let detail;
    if(LAST_TOKEN_ERR === 'issue-request-failed')
      detail = "Lifecheck couldn't be reached. Check your connection and try again.";
    else if(LAST_TOKEN_ERR === 'sitekey-rejected')
      detail = "This site key doesn't exist, or " + (HOST || 'this domain') + " isn't on its allowed-domains list.";
    else
      detail = "Lifecheck isn't set up for this site.";
    return { short: line, title: line, detail: detail };
  }

  function keyFail(){
    const t = tokenFailText();
    chkBox.classList.remove('spin');
    chkBox.classList.add('jammed');
    chkBox.querySelector('i').className = 'fa-solid fa-gear';
    chkLabel.textContent = t.short;
    chkLabel.title = t.detail;
    logEvent('key_fail', { outcome:'suspicious', suspicious:!FIRST_PARTY, detail:{ serverMode:SERVER_MODE, firstParty:FIRST_PARTY, reason:LAST_TOKEN_ERR } });
    // Tell the host page, so it can fall back instead of waiting forever on a
    // callback that is never going to fire.
    post('error', { code: LAST_TOKEN_ERR || 'no-sitekey', message: t.detail });
    // A jam is worth one more crank — restore the box so a click retries,
    // rather than leaving a dead widget the visitor can't do anything with.
    setTimeout(function(){
      if(chkBox.classList.contains('checked')) return;
      chkBox.classList.remove('jammed');
      chkBox.querySelector('i').className = 'fa-solid fa-rotate-right';
      chkLabel.textContent = 'Give it another crank';
    }, 2600);
    locked = false;
  }

  function openChallenge(restrictTo){
    const pool = restrictTo || ((COARSE || touchUsed) ? TOUCH_TYPES : TEST_TYPES);
    let type = pool[Math.floor(Math.random()*pool.length)];
    if(type === lastType) type = pool[(pool.indexOf(type)+1) % pool.length];
    // `?lcgame=trace` pins the challenge, so an integrator (or our own test
    // run) can look at one game repeatedly instead of reloading until the
    // dice cooperate. It only chooses WHICH game — there is nothing to gain
    // by picking one, you still have to solve it.
    // …but an explicit swap request wins over it: the visitor asked for a
    // different game, and handing them the same one back is not an answer.
    const forced = P.get('lcgame');
    if(!restrictTo && forced && TEST_META[forced]) type = forced;
    lastType = type;
    challengeStart = Date.now();
    TRACE.begin(type);
    // Each builder wires its own Verify handler; clear the previous one so a
    // retry can't fire the last challenge's check against the new board.
    verifyBtn.onclick = null;

    collapsed.classList.add('hidden');
    expanded.classList.remove('hidden');
    statusBox.classList.add('hidden');
    statusBox.className = 'status hidden';
    expFooter.classList.remove('hidden');
    verifyBtn.classList.remove('hidden');
    verifyBtn.disabled = false;
    verifyBtn.textContent = 'Verify';

    const meta = TEST_META[type];
    testChip.style.setProperty('--chip', meta.color);
    testChip.style.setProperty('--chip-s', meta.colorS);
    testChip.innerHTML = `<i class="fa-solid ${meta.icon}"></i> ${meta.label}`;

    logEvent('challenge_open', { challenge:type });

    if(type === 'imagepick') buildImagePick();
    if(type === 'oddone')    buildOddOne();
    if(type === 'tally')     buildTally();
    if(type === 'grid')      buildGrid();
    if(type === 'slider')    buildSlider();
    if(type === 'rotate')    buildRotate();
    if(type === 'sequence')  buildSequence();
    if(type === 'code')      buildCode();
    if(type === 'trace')     buildTrace();
    if(type === 'catchit')   buildCatch();
    if(type === 'pairs')     buildPairs();
    if(POINTER_ONLY.indexOf(type) >= 0) offerSwap();
    reportSize();
  }

  // NOTE: there is deliberately no "close" control on an open challenge.
  // An open challenge has no dismiss control by design.

  /* ---------------- shared tile plumbing ----------------
     v1.3: every tappable thing in a challenge is a real button as far as the
     keyboard and screen readers are concerned — v1.2's tiles were plain divs
     with a click handler, which locked out anyone not using a mouse. The same
     wrapper is where each activation enters the demonstration trace, so no
     game has to remember to record its own taps. */
  function activatable(el, label, fn){
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    if(label) el.setAttribute('aria-label', label);
    el.addEventListener('click', (ev) => fn(ev, el));
    el.addEventListener('keydown', (ev) => {
      if(ev.key === 'Enter' || ev.key === ' ' || ev.key === 'Spacebar'){
        ev.preventDefault();
        fn(ev, el);
      }
    });
    return el;
  }
  /* Two of the eleven genuinely need a pointer: you cannot trace a curve or
     chase a drifting target with a keyboard, and pretending otherwise is
     worse than admitting it — a probe you can tab to and press Enter on
     twice isn't a challenge at all, it's a two-keystroke bypass. So those
     two are never handed out on touch, they don't accept keyboard
     activation, and they carry a way out: one keypress swaps the board for a
     game that is fully keyboard-playable. That costs an attacker nothing
     (they still have to solve whatever comes next) and costs a keyboard user
     nothing either. */
  const KEYBOARD_TYPES = ['imagepick','oddone','tally','grid','sequence','code','pairs','slider','rotate'];
  const POINTER_ONLY   = ['trace','catchit'];
  function offerSwap(){
    const wrap = document.createElement('div');
    wrap.className = 'swap-row';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swap-btn';
    btn.textContent = 'Needs a mouse? Get a different one';
    btn.addEventListener('click', () => {
      logEvent('challenge_swap', { challenge:lastType, detail:{ from:lastType } });
      TRACE.abort();
      openChallenge(KEYBOARD_TYPES);
    });
    wrap.appendChild(btn);
    challengeArea.appendChild(wrap);
  }

  // Wrap the Verify button so a submission is recorded before it is judged.
  function onVerify(fn){
    verifyBtn.onclick = (ev) => { TRACE.act('submit', {}); fn(ev); };
  }
  // Unified pointer drag: v1.2 wired mouse and touch handlers separately and
  // never removed the window-level ones, so every challenge left its
  // listeners behind for the life of the frame.
  function dragify(el, onMove, onStart, onEnd){
    let id = null;
    el.style.touchAction = 'none';
    el.addEventListener('pointerdown', (e) => {
      id = e.pointerId;
      try{ el.setPointerCapture(id); }catch(err){}
      e.preventDefault();
      if(onStart) onStart(e);
      onMove(e);
    });
    el.addEventListener('pointermove', (e) => { if(id === e.pointerId) onMove(e); });
    const stop = (e) => {
      if(id !== e.pointerId) return;
      try{ el.releasePointerCapture(id); }catch(err){}
      id = null;
      if(onEnd) onEnd(e);
    };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
  }

  /* ---------------- 1. IMAGE PICK (click the named life form) ---------------- */
  function buildImagePick(){
    const items = pick(LIFE, 9);                     // 9 distinct life forms
    const targetIdx = Math.floor(Math.random()*items.length);
    const target = items[targetIdx];
    promptText.innerHTML = `Click the <b class="hl">${target.n}</b><span class="sub">Tap its picture to prove you can see it.</span>`;
    verifyBtn.classList.add('hidden');               // self-validating

    challengeArea.innerHTML = `<div class="grid" id="gridEl"></div>`;
    const gridEl = document.getElementById('gridEl');
    let done = false, wrong = 0;
    const els = [];
    items.forEach((it, i) => {
      const el = tileWith(it.e);
      els.push(el);
      activatable(el, it.n, (ev) => {
        if(done) return;
        const right = it.n === target.n;
        TRACE.tapOn(el, ev, { i:i, label:it.n, correct:right });
        if(right){
          done = true;
          el.classList.add('correct-flash');
          logEvent('minigame_correct', { challenge:'imagepick', outcome:'pass', detail:{ target:target.n } });
          setTimeout(()=> decide(true, ''), 260);
        } else {
          wrong++;
          el.classList.add('wrong');
          logEvent('minigame_wrong', { challenge:'imagepick', outcome:'fail', detail:{ target:target.n, picked:it.n, wrong } });
          if(wrong >= 2){ done = true; setTimeout(()=> decide(false, 'Wrong pick.'), 450); }
          else setTimeout(()=> el.classList.remove('wrong'), 500);
        }
      });
      gridEl.appendChild(el);
    });
    TRACE.measure(box => TRACE.state({
      kind: 'pick-one',
      prompt: 'click the ' + target.n,
      answer: [targetIdx],
      tiles: items.map((it, i) => ({ i:i, label:it.n, life:true, box:box(els[i]) }))
    }));
  }

  /* ---------------- 2. ODD ONE OUT (tap what isn't alive) ---------------- */
  function buildOddOne(){
    const lifeTiles = pick(LIFE, 8);
    const odd = MACHINE[Math.floor(Math.random()*MACHINE.length)];
    promptText.innerHTML = `Tap the one that isn't alive<span class="sub">Eight life forms, one machine. Find the machine.</span>`;
    verifyBtn.classList.add('hidden');

    const all = shuffle(lifeTiles.map(x=>({...x,life:true})).concat([{...odd,life:false}]));
    challengeArea.innerHTML = `<div class="grid" id="gridEl"></div>`;
    const gridEl = document.getElementById('gridEl');
    let done = false, wrong = 0;
    const els = [];
    all.forEach((it, i) => {
      const el = tileWith(it.e);
      els.push(el);
      activatable(el, it.n, (ev) => {
        if(done) return;
        TRACE.tapOn(el, ev, { i:i, label:it.n, correct:!it.life });
        if(!it.life){
          done = true;
          el.classList.add('correct-flash');
          logEvent('minigame_correct', { challenge:'oddone', outcome:'pass', detail:{ odd:odd.n } });
          setTimeout(()=> decide(true, ''), 260);
        } else {
          wrong++;
          el.classList.add('wrong');
          logEvent('minigame_wrong', { challenge:'oddone', outcome:'fail', detail:{ picked:it.n, wrong } });
          if(wrong >= 2){ done = true; setTimeout(()=> decide(false, 'That one is alive.'), 450); }
          else setTimeout(()=> el.classList.remove('wrong'), 500);
        }
      });
      gridEl.appendChild(el);
    });
    TRACE.measure(box => TRACE.state({
      kind: 'pick-one',
      prompt: 'tap the one that is not alive',
      answer: all.map((it,i)=> it.life ? -1 : i).filter(i=>i>=0),
      tiles: all.map((it, i) => ({ i:i, label:it.n, life:it.life, box:box(els[i]) }))
    }));
  }

  /* ---------------- 3. TALLY (count the life forms) ---------------- */
  function buildTally(){
    const lifeCount = 2 + Math.floor(Math.random()*4);          // 2..5
    const lifeTiles = pick(LIFE, lifeCount).map(x=>({...x,life:true}));
    const machineTiles = pick(MACHINE, 9-lifeCount).map(x=>({...x,life:false}));
    const all = shuffle(lifeTiles.concat(machineTiles));
    promptText.innerHTML = `How many <b class="hl">life forms</b>?<span class="sub">Count the living things, then tap the number.</span>`;
    verifyBtn.classList.add('hidden');

    challengeArea.innerHTML = `<div class="grid" id="gridEl" style="pointer-events:none"></div><div class="numpad" id="numEl"></div>`;
    const gridEl = document.getElementById('gridEl');
    const tileEls = [];
    // The board isn't tappable in this game, but it still has to be READABLE:
    // you cannot count what a screen reader won't name.
    gridEl.setAttribute('role', 'list');
    gridEl.setAttribute('aria-label', 'Board to count');
    all.forEach(it=>{
      const el = tileWith(it.e);
      el.setAttribute('role', 'listitem');
      el.setAttribute('aria-label', it.n);
      tileEls.push(el);
      gridEl.appendChild(el);
    });

    const numEl = document.getElementById('numEl');
    let done = false, wrong = 0;
    const btnEls = [];
    for(let k=1;k<=6;k++){
      const b = document.createElement('div');
      b.className = 'numbtn';
      b.textContent = k;
      btnEls.push(b);
      activatable(b, k + '', (ev) => {
        if(done) return;
        TRACE.tapOn(b, ev, { value:k, correct:k === lifeCount });
        if(k === lifeCount){
          done = true;
          b.classList.add('right');
          logEvent('minigame_correct', { challenge:'tally', outcome:'pass', detail:{ count:lifeCount } });
          setTimeout(()=> decide(true, ''), 260);
        } else {
          wrong++;
          b.classList.add('wrong');
          logEvent('minigame_wrong', { challenge:'tally', outcome:'fail', detail:{ count:lifeCount, picked:k, wrong } });
          if(wrong >= 2){ done = true; setTimeout(()=> decide(false, 'Wrong count.'), 450); }
          else setTimeout(()=> b.classList.remove('wrong'), 500);
        }
      });
      numEl.appendChild(b);
    }
    TRACE.measure(box => TRACE.state({
      kind: 'count',
      prompt: 'how many life forms are on the board',
      answer: lifeCount,
      tiles: all.map((it, i) => ({ i:i, label:it.n, life:it.life, box:box(tileEls[i]) })),
      options: btnEls.map((b, i) => ({ value:i+1, box:box(b) }))
    }));
  }

  /* ---------------- 4. GRID (select every life form) ---------------- */
  function buildGrid(){
    promptText.innerHTML = `Select every life form<span class="sub">Tap all living things, then verify.</span>`;
    const lifeCount = 4 + Math.floor(Math.random()*2);
    const chosenLife = pick(LIFE, lifeCount).map(x=>({...x,life:true}));
    const chosenMachine = pick(MACHINE, 9 - lifeCount).map(x=>({...x,life:false}));
    const tiles = shuffle(chosenLife.concat(chosenMachine));
    const correctSet = new Set(tiles.map((t,i)=>t.life ? i : null).filter(v=>v!==null));
    const selected = new Set();

    challengeArea.innerHTML = `<div class="grid" id="gridEl"></div>`;
    const gridEl = document.getElementById('gridEl');
    const els = [];
    // Nothing selected can never be the answer, so don't let it be submitted —
    // v1.2 happily accepted an empty board and spent one of the two attempts.
    function syncBtn(){
      verifyBtn.disabled = selected.size === 0;
      verifyBtn.textContent = selected.size ? `Verify (${selected.size})` : 'Verify';
    }
    tiles.forEach((t, i) => {
      const el = tileWith(t.e);
      els.push(el);
      activatable(el, t.n, (ev) => {
        const nowOn = !selected.has(i);
        if(nowOn){ selected.add(i); el.classList.add('selected'); }
        else { selected.delete(i); el.classList.remove('selected'); }
        el.setAttribute('aria-pressed', nowOn ? 'true' : 'false');
        TRACE.tapOn(el, ev, { i:i, label:t.n, on:nowOn, correct:nowOn === correctSet.has(i) });
        syncBtn();
      });
      el.setAttribute('aria-pressed', 'false');
      gridEl.appendChild(el);
    });
    syncBtn();

    onVerify(() => {
      const correct = selected.size === correctSet.size && [...selected].every(i=>correctSet.has(i));
      if(!correct){
        [...gridEl.children].forEach((el,i)=>{
          if(selected.has(i) && !correctSet.has(i)) el.classList.add('wrong');
          if(correctSet.has(i) && !selected.has(i)) el.classList.add('correct-flash');
        });
      }
      decide(correct, correct ? '' : 'Some signals were misread.');
    });

    TRACE.measure(box => TRACE.state({
      kind: 'pick-many',
      prompt: 'select every life form',
      answer: [...correctSet],
      tiles: tiles.map((t, i) => ({ i:i, label:t.n, life:t.life, box:box(els[i]) }))
    }));
  }

  /* ---------------- 5. SLIDER ---------------- */
  function buildSlider(){
    promptText.innerHTML = `Guide the visitor home<span class="sub">Drag the craft into the landing zone.</span>`;
    const zoneWidthPct = 16;
    const startPct = 15 + Math.random()*(85-15-zoneWidthPct);
    const target = { start:startPct, end:startPct+zoneWidthPct };
    let value = 0;

    challengeArea.innerHTML = `
      <div class="slide-wrap">
        <div class="track" id="trackEl">
          <div class="target-zone" id="zoneEl"><i class="fa-solid fa-house-chimney"></i></div>
          <div class="handle bob" id="handleEl" role="slider" tabindex="0"
               aria-label="Craft position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i class="fa-solid fa-rocket"></i></div>
        </div>
      </div>`;
    const trackEl = document.getElementById('trackEl');
    const zoneEl = document.getElementById('zoneEl');
    const handleEl = document.getElementById('handleEl');

    requestAnimationFrame(()=>{
      zoneEl.style.left = target.start + '%';
      zoneEl.style.width = zoneWidthPct + '%';
    });

    function setHandle(pct){
      pct = Math.max(0, Math.min(100, pct));
      value = pct;
      handleEl.style.left = `calc(${pct}% - ${pct/100*40}px)`;
      handleEl.setAttribute('aria-valuenow', Math.round(pct));
    }
    setHandle(0);

    function pctFromClientX(clientX){
      const rect = trackEl.getBoundingClientRect();
      return ((clientX - rect.left) / rect.width) * 100;
    }
    // Dragging is on the whole track, not just the 40px handle — v1.2 made you
    // grab a small circle exactly, which is the fiddliest part of the game and
    // none of what it is actually testing.
    dragify(trackEl,
      (e) => { setHandle(pctFromClientX(e.clientX)); TRACE.act('drag', { v:+value.toFixed(1) }); },
      () => { handleEl.classList.remove('bob'); },
      () => { TRACE.act('drop', { v:+value.toFixed(1) }); });

    handleEl.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 10 : 2;
      if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); handleEl.classList.remove('bob'); setHandle(value + step); TRACE.act('key', { key:e.key, v:+value.toFixed(1) }); }
      if(e.key === 'ArrowLeft'  || e.key === 'ArrowDown'){ e.preventDefault(); handleEl.classList.remove('bob'); setHandle(value - step); TRACE.act('key', { key:e.key, v:+value.toFixed(1) }); }
    });

    onVerify(() => {
      const correct = value >= target.start-2 && value <= target.end+2 && value > 3;
      decide(correct, correct ? '' : 'The craft drifted off course.');
    });

    TRACE.measure(box => TRACE.state({
      kind: 'continuous-1d',
      prompt: 'drag the craft into the landing zone',
      answer: { min:target.start-2, max:target.end+2, mid:+((target.start+target.end)/2).toFixed(2) },
      track: box(trackEl),
      zone: box(zoneEl),
      handle: box(handleEl)
    }));
  }

  /* ---------------- 6. ROTATE DIAL ---------------- */
  function buildRotate(){
    promptText.innerHTML = `Aim the dish<span class="sub">Rotate the marker into the highlighted arc.</span>`;
    const r = 58, cx = 75, cy = 75;
    const targetStart = Math.floor(Math.random()*360);
    const targetSpan = 40;
    const circumference = 2*Math.PI*r;
    const arcLen = (targetSpan/360)*circumference;

    challengeArea.innerHTML = `
      <div class="dial-wrap">
        <div class="dial" id="dialEl">
          <svg viewBox="0 0 150 150">
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--stroke)" stroke-width="10"/>
            <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--green)" stroke-width="10"
              stroke-dasharray="${arcLen} ${circumference-arcLen}"
              stroke-dashoffset="${-(targetStart/360)*circumference}"
              transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round" opacity="0.85"/>
          </svg>
          <div class="dial-center">Line up<br>the marker</div>
          <div class="dial-handle" id="dialHandle" role="slider" tabindex="0"
               aria-label="Dish bearing" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0"><i class="fa-solid fa-satellite-dish"></i></div>
        </div>
      </div>`;

    const dialEl = document.getElementById('dialEl');
    const handle = document.getElementById('dialHandle');
    let angle = 0;

    function place(deg){
      angle = ((deg % 360) + 360) % 360;
      const rad = (angle-90) * Math.PI/180;
      handle.style.left = (cx + r*Math.cos(rad)) + 'px';
      handle.style.top  = (cy + r*Math.sin(rad)) + 'px';
      handle.setAttribute('aria-valuenow', Math.round(angle));
    }
    place(targetStart+180);

    function angleFromEvent(clientX, clientY){
