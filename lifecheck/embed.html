      const rect = dialEl.getBoundingClientRect();
      const dx = clientX - (rect.left+rect.width/2);
      const dy = clientY - (rect.top+rect.height/2);
      return (Math.atan2(dy,dx)*180/Math.PI) + 90;
    }
    // Grab anywhere on the dial, same reasoning as the slider.
    dragify(dialEl,
      (e) => { place(angleFromEvent(e.clientX, e.clientY)); TRACE.act('drag', { deg:Math.round(angle) }); },
      null,
      () => { TRACE.act('drop', { deg:Math.round(angle) }); });

    handle.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 15 : 4;
      if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); place(angle + step); TRACE.act('key', { key:e.key, deg:Math.round(angle) }); }
      if(e.key === 'ArrowLeft'  || e.key === 'ArrowDown'){ e.preventDefault(); place(angle - step); TRACE.act('key', { key:e.key, deg:Math.round(angle) }); }
    });

    onVerify(() => {
      let diff = ((angle - (targetStart+targetSpan/2) + 540) % 360) - 180;
      const correct = Math.abs(diff) <= targetSpan/2 + 3;
      decide(correct, correct ? '' : 'The dish missed the signal.');
    });

    TRACE.measure(box => TRACE.state({
      kind: 'continuous-angle',
      prompt: 'rotate the marker into the highlighted arc',
      answer: { deg:(targetStart+targetSpan/2)%360, tolerance:targetSpan/2 + 3 },
      arc: { start:targetStart, span:targetSpan },
      dial: box(dialEl),
      handle: box(handle)
    }));
  }

  /* ---------------- 7. SEQUENCE ---------------- */
  function buildSequence(){
    promptText.innerHTML = `Tap the beacons in order<span class="sub">Lowest signal number first.</span>`;
    // v1.3: five DISTINCT numbers out of 1..29 rather than always 1,2,3,4,5.
    // The old board could be solved by looking for the glyph "1" and counting
    // up from there; this one has to actually be ordered, and it gives the
    // trace data a real comparison task instead of a fixed answer key.
    const nums = shuffle(Array.from({length:29}, (_,i)=>i+1)).slice(0,5);
    const order = shuffle(nums);
    const sorted = nums.slice().sort((a,b)=>a-b);
    let step = 0, restarts = 0;
    let next = sorted[0];

    challengeArea.innerHTML = `<div class="seq-grid" id="seqEl"></div>`;
    const seqEl = document.getElementById('seqEl');
    const els = [];
    order.forEach(num=>{
      const el = document.createElement('div');
      el.className = 'beacon';
      el.textContent = num;
      els.push(el);
      activatable(el, 'beacon ' + num, (ev) => {
        if(el.classList.contains('done')) return;
        TRACE.tapOn(el, ev, { value:num, expected:next, correct:num === next });
        if(num === next){
          el.classList.add('done');
          step++;
          next = sorted[step];
          if(step === sorted.length){
            logEvent('minigame_correct', { challenge:'sequence', outcome:'pass', detail:{ restarts } });
            setTimeout(()=> decide(true, ''), 250);
          }
        } else {
          el.classList.add('bad');
          restarts++;
          logEvent('minigame_wrong', { challenge:'sequence', outcome:'fail', detail:{ expected:next, tapped:num, restarts } });
          // Three false starts is a game that isn't going anywhere; end it
          // rather than looping forever with no way out.
          if(restarts >= 3){ setTimeout(()=> decide(false, 'The beacons never lined up.'), 450); return; }
          setTimeout(()=>{
            [...seqEl.children].forEach(c=>c.classList.remove('done','bad'));
            step = 0; next = sorted[0];
          }, 400);
        }
      });
      seqEl.appendChild(el);
    });
    verifyBtn.classList.add('hidden'); // self-validating

    TRACE.measure(box => TRACE.state({
      kind: 'ordered-taps',
      prompt: 'tap the beacons in ascending order',
      answer: sorted,
      beacons: order.map((num, i) => ({ i:i, value:num, box:box(els[i]) }))
    }));
  }

  /* ---------------- 8. CODE ---------------- */
  function buildCode(){
    promptText.innerHTML = `Type the signal code<span class="sub">Case doesn't matter.</span>`;
    const charset = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let code = '';
    for(let i=0;i<5;i++) code += charset[Math.floor(Math.random()*charset.length)];
    const colors = ['var(--blue)','var(--green)','var(--pink)','var(--yellow)','var(--red)'];

    let spans = '';
    for(let i=0;i<code.length;i++){
      const rot = (Math.random()*32-16).toFixed(1);
      const ty = (Math.random()*10-5).toFixed(1);
      const col = colors[i % colors.length];
      spans += `<span class="code-char" style="transform:rotate(${rot}deg) translateY(${ty}px); color:${col};">${code[i]}</span>`;
    }

    challengeArea.innerHTML = `
      <div class="code-box" aria-hidden="true">
        <svg class="noise" viewBox="0 0 300 70" preserveAspectRatio="none">
          ${Array.from({length:6}).map(()=>{
            const y1=Math.random()*70, y2=Math.random()*70;
            return `<line x1="0" y1="${y1.toFixed(1)}" x2="300" y2="${y2.toFixed(1)}" stroke="var(--stroke)" stroke-width="2"/>`;
          }).join('')}
        </svg>
        ${spans}
      </div>
      <input class="code-input" id="codeInput" maxlength="8" autocomplete="off" spellcheck="false"
             autocapitalize="characters" aria-label="Signal code" placeholder="Enter code" />
    `;

    const input = document.getElementById('codeInput');
    // Focus it and let Enter submit — v1.2 made you click into the box and
    // then reach for the button, which is two extra moves for a typing game.
    setTimeout(()=>{ try{ input.focus({ preventScroll:true }); }catch(e){} }, 60);
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); verifyBtn.click(); }
      else TRACE.act('key', { len:input.value.length });
    });

    onVerify(() => {
      const val = input.value.trim().toUpperCase();
      const correct = val === code;
      if(!correct) input.classList.add('wrong');
      decide(correct, correct ? '' : "That code didn't match.");
    });

    TRACE.measure(box => TRACE.state({
      kind: 'transcribe',
      prompt: 'type the code shown',
      answer: code,
      length: code.length,
      input: box(input)
    }));
  }

  /* ---------------- 9. TRACE THE BEAM (v1.3) ----------------
     Follow a curve from the emitter to the receiver without straying off it.
     Nothing else in the set asks for a sustained, shaped movement, and the
     path a hand takes through a curve is about the least fakeable thing the
     widget can watch — which also makes it the richest demonstration in the
     set for a policy learning to steer. */
  function buildTrace(){
    promptText.innerHTML = `Trace the beam<span class="sub">Drag from the dot to the dish, staying on the line.</span>`;
    verifyBtn.classList.add('hidden');               // self-validating

    const W = 300, H = 120, TOL = 26;                // tolerance in svg units
    const p0 = { x:22,  y:20 + Math.random()*80 };
    const p2 = { x:278, y:20 + Math.random()*80 };
    // Half the time it's a simple arc, half the time an S-bend that doubles
    // back on itself. A single curve shape would be learnable in one look.
    const sBend = Math.random() < 0.5;
    const p1 = { x: sBend ? 105 : 150, y:Math.random() < 0.5 ? 8 + Math.random()*22 : H - 8 - Math.random()*22 };
    const p1b = { x:200, y: sBend ? (H - p1.y) : p1.y };

    const pts = [];
    for(let i=0;i<=64;i++){
      const t = i/64, u = 1-t;
      if(sBend){
        pts.push({ x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p1b.x + t*t*t*p2.x,
                   y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p1b.y + t*t*t*p2.y });
      } else {
        pts.push({ x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
                   y: u*u*p0.y + 2*u*t*p1.y + t*t*p2.y });
      }
    }
    const pathD = sBend
      ? `M${p0.x} ${p0.y} C${p1.x} ${p1.y} ${p1b.x} ${p1b.y} ${p2.x} ${p2.y}`
      : `M${p0.x} ${p0.y} Q${p1.x} ${p1.y} ${p2.x} ${p2.y}`;

    challengeArea.innerHTML = `
      <div class="trace-wrap" id="traceWrap">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" class="trace-svg">
          <path d="${pathD}" class="beam-track"/>
          <path d="${pathD}" class="beam-live" id="beamLive"/>
          <circle cx="${p0.x}" cy="${p0.y}" r="9" class="beam-start" id="beamStart"/>
          <circle cx="${p2.x}" cy="${p2.y}" r="9" class="beam-end"/>
        </svg>
        <div class="trace-hint" id="traceHint">Start at the glowing dot</div>
      </div>`;

    const wrap = document.getElementById('traceWrap');
    const live = document.getElementById('beamLive');
    const hint = document.getElementById('traceHint');
    const len = live.getTotalLength ? live.getTotalLength() : 400;
    live.style.strokeDasharray = len;
    live.style.strokeDashoffset = len;

    let started = false, done = false, idx = 0, strays = 0;

    function toSvg(e){
      const r = wrap.getBoundingClientRect();
      return { x: ((e.clientX - r.left)/r.width)*W, y: ((e.clientY - r.top)/r.height)*H };
    }
    function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

    function move(e){
      if(done) return;
      const p = toSvg(e);
      if(!started){
        if(dist(p, p0) > TOL) return;                // must begin at the emitter
        started = true;
        hint.textContent = 'Keep going…';
        wrap.classList.add('live');
      }
      // Walk the cursor forward along the curve while it stays near it.
      let advanced = 0;
      while(idx < pts.length-1 && dist(p, pts[idx+1]) < TOL){ idx++; advanced++; }
      if(advanced){
        live.style.strokeDashoffset = len * (1 - idx/(pts.length-1));
        TRACE.act('drag', { seg:idx, at:[+(p.x/W).toFixed(3), +(p.y/H).toFixed(3)] });
      } else if(dist(p, pts[idx]) > TOL*1.9){
        strays++;
        wrap.classList.add('stray');
        setTimeout(()=> wrap.classList.remove('stray'), 220);
      }
      if(idx >= pts.length-1){
        done = true;
        wrap.classList.add('ok');
        hint.textContent = 'Signal locked.';
        logEvent('minigame_correct', { challenge:'trace', outcome:'pass', detail:{ strays } });
        setTimeout(()=> decide(true, ''), 320);
      }
    }
    function release(){
      if(done || !started) return;
      // Let go early: reset rather than fail, the curve is the whole game.
      started = false; idx = 0;
      live.style.strokeDashoffset = len;
      wrap.classList.remove('live');
      hint.textContent = 'Lost it. Start again at the dot';
      strays++;
      TRACE.act('drop', { seg:idx, aborted:true });
      if(strays > 14){
        done = true;
        logEvent('minigame_wrong', { challenge:'trace', outcome:'fail', detail:{ strays } });
        decide(false, 'The beam kept breaking.');
      }
    }
    dragify(wrap, move, null, release);

    TRACE.measure(box => TRACE.state({
      kind: 'path-follow',
      prompt: 'drag along the curve from start to end',
      answer: pts.filter((_,i)=> i % 4 === 0)
                 .map(p => [ +(p.x/W).toFixed(3), +(p.y/H).toFixed(3) ]),
      tolerance: +(TOL/W).toFixed(3),
      start: [ +(p0.x/W).toFixed(3), +(p0.y/H).toFixed(3) ],
      end:   [ +(p2.x/W).toFixed(3), +(p2.y/H).toFixed(3) ],
      area: box(wrap)
    }));
  }

  /* ---------------- 10. TAG THE PROBE (v1.3) ----------------
     A drifting target you have to click twice. Every other game is static, so
     nothing until now measured whether a pointer can chase something — and
     leading a moving target is exactly the prediction problem a policy has to
     solve, which makes the traces here worth more than their length. */
  function buildCatch(){
    promptText.innerHTML = `Tag the probe<span class="sub">Click the drifting probe twice.</span>`;
    verifyBtn.classList.add('hidden');

    challengeArea.innerHTML = `
      <div class="catch-box" id="catchBox">
        <div class="probe" id="probeEl"><i class="fa-solid fa-satellite"></i></div>
        <div class="catch-tally" id="catchTally">0 / 2</div>
      </div>`;

    const boxEl = document.getElementById('catchBox');
    const probe = document.getElementById('probeEl');
    const tally = document.getElementById('catchTally');

    let hits = 0, misses = 0, done = false;
    let px = 0.5, py = 0.5;                                  // 0..1 of the box
    let vx = (Math.random() < 0.5 ? -1 : 1) * 0.0035;
    let vy = (Math.random() < 0.5 ? -1 : 1) * 0.0030;
    let raf = 0;

    function step(){
      if(done) return;
      // gentle random walk so the drift never becomes a predictable bounce
      vx += (Math.random()-0.5) * 0.00035;
      vy += (Math.random()-0.5) * 0.00035;
      const cap = 0.007 + hits*0.004;
      vx = Math.max(-cap, Math.min(cap, vx));
      vy = Math.max(-(cap*0.86), Math.min(cap*0.86, vy));
      px += vx; py += vy;
      if(px < 0.06){ px = 0.06; vx = Math.abs(vx); }
      if(px > 0.94){ px = 0.94; vx = -Math.abs(vx); }
      if(py < 0.12){ py = 0.12; vy = Math.abs(vy); }
      if(py > 0.88){ py = 0.88; vy = -Math.abs(vy); }
      probe.style.left = (px*100) + '%';
      probe.style.top  = (py*100) + '%';
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    function stop(){ done = true; if(raf) cancelAnimationFrame(raf); }

    // Deliberately NOT `activatable`: a keyboard Enter on a moving target
    // proves nothing, and accepting one would make this the easiest challenge
    // in the set to automate. Keyboard users take the swap offered below.
    probe.addEventListener('click', (ev) => {
      if(done) return;
      ev.stopPropagation();
      hits++;
      TRACE.act('hit', { n:hits, probe:[+px.toFixed(3), +py.toFixed(3)],
                         v:[+(vx*1000).toFixed(2), +(vy*1000).toFixed(2)] });
      probe.classList.add('tagged');
      setTimeout(()=> probe.classList.remove('tagged'), 220);
      tally.textContent = hits + ' / 2';
      // It gets away from you a little after the first tag, so the second one
      // isn't just the first one repeated.
      vx *= 1.45; vy *= 1.45;
      if(hits >= 2){
        stop();
        probe.classList.add('locked');
        logEvent('minigame_correct', { challenge:'catchit', outcome:'pass', detail:{ misses } });
        setTimeout(()=> decide(true, ''), 300);
      }
    });

    boxEl.addEventListener('click', (ev) => {
      if(done) return;
      misses++;
      TRACE.act('miss', { n:misses, probe:[+px.toFixed(3), +py.toFixed(3)] });
      boxEl.classList.add('missed');
      setTimeout(()=> boxEl.classList.remove('missed'), 200);
      if(misses >= 6){
        stop();
        logEvent('minigame_wrong', { challenge:'catchit', outcome:'fail', detail:{ hits, misses } });
        decide(false, 'The probe got away.');
      }
    });

    // Don't let it run forever if the tab is left open.
    setTimeout(()=>{
      if(done) return;
      stop();
      logEvent('minigame_wrong', { challenge:'catchit', outcome:'fail', detail:{ hits, misses, timeout:true } });
      decide(false, 'The probe drifted out of range.');
    }, 22000);

    TRACE.measure(box => TRACE.state({
      kind: 'moving-target',
      prompt: 'click the drifting probe twice',
      answer: { hits:2 },
      area: box(boxEl),
      probeRadius: 0.075
    }));
  }

  /* ---------------- 11. FIND THE PAIR (v1.3) ----------------
     Six tiles, two identical. Cheap for a person, awkward for a classifier
     that scores each tile alone: the answer is a RELATION between tiles, not
     a property of any one of them. */
  function buildPairs(){
    promptText.innerHTML = `Find the twins<span class="sub">Two of these are the same. Tap them both.</span>`;
    verifyBtn.classList.add('hidden');

    const base = pick(LIFE.concat(MACHINE), 5);
    const twin = base[Math.floor(Math.random()*base.length)];
    const items = shuffle(base.concat([twin]));
    const twinIdx = items.map((it,i)=> it.n === twin.n ? i : -1).filter(i=>i>=0);

    challengeArea.innerHTML = `<div class="grid pair-grid" id="gridEl"></div>`;
    const gridEl = document.getElementById('gridEl');
    const els = [];
    let picked = [], done = false, wrong = 0;

    items.forEach((it, i) => {
      const el = tileWith(it.e);
      els.push(el);
      activatable(el, it.n, (ev) => {
        if(done || picked.indexOf(i) >= 0) return;
        picked.push(i);
        el.classList.add('selected');
        TRACE.tapOn(el, ev, { i:i, label:it.n, correct:twinIdx.indexOf(i) >= 0 });
        if(picked.length < 2) return;

        const right = picked.every(p => twinIdx.indexOf(p) >= 0);
        if(right){
          done = true;
          picked.forEach(p => { els[p].classList.remove('selected'); els[p].classList.add('correct-flash'); });
          logEvent('minigame_correct', { challenge:'pairs', outcome:'pass', detail:{ twin:twin.n } });
          setTimeout(()=> decide(true, ''), 300);
        } else {
          wrong++;
          const bad = picked.slice();
          logEvent('minigame_wrong', { challenge:'pairs', outcome:'fail', detail:{ twin:twin.n, wrong } });
          bad.forEach(p => { els[p].classList.remove('selected'); els[p].classList.add('wrong'); });
          picked = [];
          if(wrong >= 2){ done = true; setTimeout(()=> decide(false, "Those two weren't a match."), 500); }
          else setTimeout(()=> bad.forEach(p => els[p].classList.remove('wrong')), 550);
        }
      });
      gridEl.appendChild(el);
    });

    TRACE.measure(box => TRACE.state({
      kind: 'find-pair',
      prompt: 'tap the two identical tiles',
      answer: twinIdx,
      tiles: items.map((it, i) => ({ i:i, label:it.n, box:box(els[i]) }))
    }));
  }

  /* ---------------- DECIDE ---------------- */
  function decide(pass, reason){
    verifyBtn.disabled = true;
    expFooter.classList.add('hidden');
    statusBox.classList.remove('hidden');

    const solveMs = challengeStart ? (Date.now() - challengeStart) : null;
    // A "correct" answer returned impossibly fast is a bot tell — pass the
    // check (don't punish edge cases) but flag it for the model.
    const tooFast = pass && solveMs != null && solveMs < 450;
    if(tooFast) logEvent('speed_flag', { challenge:lastType, outcome:'suspicious', suspicious:true, detail:{ solveMs } });

    // Close out the demonstration: board, moves, cursor path and the label.
    TRACE.end(pass, solveMs);

    logEvent(pass ? 'challenge_pass' : 'challenge_fail', {
      challenge: lastType,
      outcome: pass ? 'pass' : 'fail',
      detail: { solveMs: solveMs }
    });

    if(pass){
      issueToken('challenge').then(function(token){
        if(!token){
          const t = tokenFailText();
          statusBox.className = 'status fail';
          statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><div>${t.title}<span class="d">${t.detail}</span></div>`;
          logEvent('key_fail', { outcome:'suspicious', suspicious:!FIRST_PARTY, detail:{ serverMode:SERVER_MODE, firstParty:FIRST_PARTY, reason:LAST_TOKEN_ERR, at:'challenge' } });
          post('error', { code: LAST_TOKEN_ERR || 'no-sitekey', message: t.detail });
          reportSize();
          return;
        }
        statusBox.className = 'status pass';
        statusBox.innerHTML = `<i class="fa-solid fa-circle-check"></i><div>Verified. Life form confirmed.<span class="d">You may proceed.</span></div>`;
        reportSize();
        setTimeout(()=>{
          logEvent('verified', { challenge:lastType, outcome:'pass', detail:{ via:'challenge' } });
          sessionSummary(true, 'challenge');
          post('verified', { token: token });
          armExpiry();
          if(INVISIBLE){
            // Nothing to fold back to — the frame goes away again.
            expanded.classList.add('hidden');
            post('collapse', {});
            return;
          }
          resetCollapsed();
          chkBox.classList.add('checked');
          chkLabel.textContent = 'Verified';
          collapsed.classList.add('is-verified');
          locked = true;
        }, 1100);
      });
    } else {
      statusBox.className = 'status fail';
      statusBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><div>Not verified.${reason ? ' '+reason : ''}<span class="d">Try a new challenge.</span></div>`;
      const retry = document.createElement('button');
      retry.className = 'retry-btn';
      retry.textContent = 'Try again';
      retry.onclick = () => { verifyBtn.onclick = null; openChallenge(); };
      statusBox.appendChild(retry);
      reportSize();
    }
  }

  // announce ready + start size reporting
  if(INVISIBLE){
    // No checkbox in invisible mode — the frame sits at zero height until
    // execute() decides a challenge is warranted.
    collapsed.classList.add('hidden');
    expanded.classList.add('hidden');
  }
  if(ro) ro.observe(document.querySelector('.stage'));
  window.addEventListener('load', reportSize);
  logEvent('widget_open', { detail:{ firstParty:FIRST_PARTY, serverMode:SERVER_MODE, mode:INVISIBLE ? 'invisible' : 'checkbox', lane:INVISIBLE ? 'invisible' : (GAME_LANE ? 'game' : 'signal') } });
  post('ready');
  reportSize();
})();
</script>
